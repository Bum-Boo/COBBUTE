appId: com.bumboo.ai-framework-controller
productName: AI Framework Controller
copyright: Copyright (c) 2026 Bum-Boo
asar: true
compression: maximum
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - package.json
extraMetadata:
  main: electron/bootstrap.cjs
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  syncDesktopName: true
  category: Utility
  maintainer: Bum-Boo
  synopsis: Local controller for Hermes and OpenClaw
  description: Manage local Hermes profiles and OpenClaw agents from one desktop controller.
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libnspr4
    - libasound2t64 | libasound2
    - libxss1
    - libxtst6
    - xdg-utils
